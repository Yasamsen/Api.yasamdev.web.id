<!doctype html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sound Vault</title>
<link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#14101a">
<style>
:root{--bg:#14101a;--card:#1d1726;--gold:#e2c98f;--ink:#f3ecdc;--mute:#8d8496;--r:18px}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:var(--bg);color:var(--ink);font-family:"Didot","Bodoni MT",Georgia,serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 30% 20%,#3a2450aa,transparent),radial-gradient(35% 35% at 80% 80%,#5a3a1f66,transparent);animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.1)}}
main{max-width:1000px;margin:auto;padding:28px 20px 60px;display:grid;gap:36px;grid-template-columns:1fr}
@media(min-width:860px){main{grid-template-columns:420px 1fr;align-items:start;padding-top:60px}}
.rise{opacity:0;transform:translateY(16px);animation:rise 1.2s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
h1{font-weight:400;font-size:clamp(28px,5vw,40px);letter-spacing:.04em;margin-bottom:22px}
.disc{width:min(72vw,300px);aspect-ratio:1;margin:0 auto 26px;border-radius:50%;position:relative;
 background:repeating-radial-gradient(#1a1422 0 3px,#221a2c 3px 6px);border:1px solid #e2c98f55;box-shadow:0 0 0 0 #e2c98f00,0 30px 60px #0009;transition:box-shadow 1.5s}
.disc:before,.disc:after{content:"";position:absolute;border-radius:50%;inset:14%;border:1px solid #e2c98f55}
.disc:after{inset:36%;background:radial-gradient(circle,var(--gold) 0 14%,#2b2035 15%);border-color:var(--gold)}
.disc i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent,#e2c98f30,transparent 30%,#e2c98f22,transparent 70%);animation:spin 9s linear infinite;animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.playing .disc{box-shadow:0 0 70px 6px #e2c98f40,0 30px 60px #0009}
.playing .disc i{animation-play-state:running}
#title{text-align:center;font-size:20px;min-height:1.4em;margin-bottom:4px}
#sub{text-align:center;color:var(--mute);font-size:14px;margin-bottom:18px}
input[type=range]{width:100%;accent-color:var(--gold);height:28px}
.time{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-top:-4px}
.ctl{display:flex;justify-content:center;align-items:center;gap:14px;margin:14px 0}
button{font:inherit;color:var(--ink);background:none;border:1px solid #e2c98f44;border-radius:50%;width:48px;height:48px;cursor:pointer;transition:.4s;display:grid;place-items:center;font-size:17px}
button:hover,button:focus-visible{border-color:var(--gold);background:#e2c98f18;outline:none}
button.on{color:var(--gold);border-color:var(--gold)}
#pp{width:72px;height:72px;font-size:24px;background:var(--gold);color:#14101a}
.row{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:14px;margin-top:8px}
.row input{flex:1}
.side{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid #e2c98f22}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.head h2{font-weight:400;font-size:20px}
.up{font:inherit;font-size:14px;width:auto;height:auto;border-radius:999px;padding:9px 18px;color:var(--gold);border-color:var(--gold)}
ul{list-style:none;padding:0;max-height:60vh;overflow:auto}
li{display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;cursor:pointer;transition:.4s;animation:rise .9s both;animation-delay:var(--d)}
li:hover{background:#e2c98f12}
li.cur{background:#e2c98f1e;color:var(--gold)}
li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li small{color:var(--mute);font-size:12px}
li b{font-weight:400;opacity:.5;padding:4px 8px}li b:hover{opacity:1}
.empty{color:var(--mute);padding:24px 8px;text-align:center;line-height:1.6}
.drop{outline:2px dashed var(--gold);outline-offset:-8px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--gold);color:#14101a;padding:10px 20px;border-radius:999px;opacity:0;transition:.6s;pointer-events:none;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rise,li{opacity:1;transform:none}}
</style></head>
<body>
<main id="app">
<section>
  <h1 class="rise">Sound Vault</h1>
  <div class="disc rise" style="--d:.4s"><i></i></div>
  <div id="title" class="rise" style="--d:.8s">Pilih sebuah lagu</div>
  <div id="sub" class="rise" style="--d:1s">Tetap berputar di latar belakang</div>
  <div class="rise" style="--d:1.2s">
    <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posisi">
    <div class="time"><span id="t1">0:00</span><span id="t2">0:00</span></div>
    <div class="ctl">
      <button id="shuf" title="Acak">⤮</button><button id="prev" title="Sebelumnya">⏮</button>
      <button id="pp" title="Putar / Jeda">▶</button>
      <button id="next" title="Berikutnya">⏭</button><button id="loop" title="Ulangi">↻</button>
    </div>
    <div class="row">Volume <input id="vol" type="range" min="0" max="100" value="80"></div>
    <div class="row">Fade <input id="fade" type="range" min="0" max="5000" step="250" value="1500"><span id="fv">1.5s</span></div>
  </div>
</section>
<section class="side rise" style="--d:1s" id="drop">
  <div class="head"><h2>Koleksi</h2><button class="up" id="upb">Unggah suara</button></div>
  <input id="file" type="file" accept="audio/*" multiple hidden>
  <ul id="list"></ul>
</section>
</main>
<audio id="a" preload="auto" playsinline></audio>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id),A=$('a');
let tracks=[],cur=-1,vol=.8,fade=1500,ft,shuf=false,loop=false,url;
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._);t._=setTimeout(()=>t.classList.remove('show'),2800)};
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const nice=n=>n.replace(/\.[a-z0-9]+$/i,'').replace(/-[A-Za-z0-9]{20,}$/,'').replace(/[_-]+/g,' ');
/* penyimpanan offline (IndexedDB) */
const db=new Promise((ok,no)=>{const r=indexedDB.open('vault',1);r.onupgradeneeded=()=>r.result.createObjectStore('t',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(m,f)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('t',m),q=f(t.objectStore('t'));t.oncomplete=()=>ok(q&&q.result);t.onerror=no})};
const all=()=>tx('readonly',s=>s.getAll()),put=o=>tx('readwrite',s=>s.put(o)),del=id=>tx('readwrite',s=>s.delete(id));
/* muat daftar: cloud (jika online) + lokal */
async function load(){
  tracks=await all();
  render();
  try{
    const r=await fetch('/api/list');if(!r.ok)throw 0;
    for(const c of await r.json()){
      const ex=tracks.find(t=>t.id===c.url);
      if(!ex)await put({id:c.url,name:nice(c.name),url:c.url,blob:null,at:Date.now()});
    }
    tracks=await all();render();
  }catch(e){}
}
function render(){
  const ul=$('list');
  if(!tracks.length){ul.innerHTML='<div class="empty">Belum ada suara.<br>Unggah file audio atau seret ke sini.</div>';return}
  ul.innerHTML='';
  tracks.forEach((t,i)=>{
    const li=document.createElement('li');li.style.setProperty('--d',i*90+'ms');
    if(i===cur)li.className='cur';
    li.innerHTML=`<span></span><small>${t.blob?'offline':'cloud'}</small><b title="Hapus">✕</b>`;
    li.firstChild.textContent=t.name;
    li.onclick=()=>play(i);
    li.querySelector('b').onclick=async e=>{e.stopPropagation();await del(t.id);const was=i===cur;tracks=await all();if(was){A.pause();cur=-1}else if(i<cur)cur--;render()};
    ul.appendChild(li);
  });
}
/* fade halus */
function ramp(to,ms,done){clearInterval(ft);const from=A.volume,st=performance.now();
  if(!ms){A.volume=to;done&&done();return}
  ft=setInterval(()=>{const p=Math.min(1,(performance.now()-st)/ms);A.volume=Math.max(0,Math.min(1,from+(to-from)*p));if(p>=1){clearInterval(ft);done&&done()}},30)}
async function play(i){
  const t=tracks[i];if(!t)return;cur=i;
  if(url)URL.revokeObjectURL(url);
  A.volume=0;
  if(t.blob){url=URL.createObjectURL(t.blob);A.src=url}
  else{A.src=t.url;
    fetch(t.url).then(r=>r.blob()).then(async b=>{t.blob=b;await put(t);render();toast('Tersimpan untuk offline')}).catch(()=>{})}
  try{await A.play();ramp(vol,fade)}catch(e){toast('Ketuk putar untuk memulai')}
  $('title').textContent=t.name;$('sub').textContent='Sedang diputar';
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:'Sound Vault',artwork:[{src:'/icon.svg',sizes:'512x512',type:'image/svg+xml'}]});
  render();
}
function step(d){if(!tracks.length)return;play(shuf?Math.floor(Math.random()*tracks.length):(cur+d+tracks.length)%tracks.length)}
function toggle(){
  if(cur<0){play(0);return}
  if(A.paused){A.play();ramp(vol,fade)}else ramp(0,fade/2,()=>A.pause());
}
$('pp').onclick=toggle;$('next').onclick=()=>step(1);$('prev').onclick=()=>step(-1);
$('shuf').onclick=e=>{shuf=!shuf;e.currentTarget.classList.toggle('on',shuf)};
$('loop').onclick=e=>{loop=!loop;e.currentTarget.classList.toggle('on',loop)};
$('vol').oninput=e=>{vol=e.target.value/100;if(!A.paused)ramp(vol,150)};
$('fade').oninput=e=>{fade=+e.target.value;$('fv').textContent=(fade/1000)+'s'};
A.onplay=()=>{$('app').classList.add('playing');$('pp').textContent='❚❚'};
A.onpause=()=>{$('app').classList.remove('playing');$('pp').textContent='▶'};
A.onended=()=>loop?play(cur):step(1);
A.ontimeupdate=()=>{if(A.duration){$('seek').value=A.currentTime/A.duration*1000;$('t1').textContent=fmt(A.currentTime);$('t2').textContent=fmt(A.duration)}
  if(fade&&A.duration&&A.duration-A.currentTime<fade/1000&&!A._out&&!loop){A._out=1;ramp(0,fade)}if(A.currentTime<1)A._out=0};
$('seek').oninput=e=>{if(A.duration)A.currentTime=e.target.value/1000*A.duration};
if('mediaSession' in navigator){const m=navigator.mediaSession;
  m.setActionHandler('play',toggle);m.setActionHandler('pause',toggle);
  m.setActionHandler('nexttrack',()=>step(1));m.setActionHandler('previoustrack',()=>step(-1));
  m.setActionHandler('seekto',d=>{A.currentTime=d.seekTime})}
/* unggah: simpan lokal dulu, lalu kirim ke Vercel Blob */
async function addFiles(fs){
  for(const f of fs){
    if(!f.type.startsWith('audio/'))continue;
    const id='local-'+Date.now()+Math.random();
    await put({id,name:nice(f.name),url:null,blob:f,at:Date.now()});
    tracks=await all();render();toast('Mengunggah '+nice(f.name)+'…');
    try{
      const key=localStorage.getItem('vkey')??prompt('Kode upload (kosongkan jika tidak ada)')??'';
      localStorage.setItem('vkey',key);
      const {upload}=await import('https://esm.sh/@vercel/blob@0.27.0/client');
      const b=await upload('sounds/'+f.name,f,{access:'public',handleUploadUrl:'/api/upload',clientPayload:key});
      await del(id);await put({id:b.url,name:nice(f.name),url:b.url,blob:f,at:Date.now()});
      toast('Tersimpan di cloud');
    }catch(e){localStorage.removeItem('vkey');toast('Tersimpan di perangkat saja')}
    tracks=await all();render();
  }
}
$('upb').onclick=()=>$('file').click();
$('file').onchange=e=>{addFiles([...e.target.files]);e.target.value=''};
const dz=$('drop');
dz.ondragover=e=>{e.preventDefault();dz.classList.add('drop')};
dz.ondragleave=()=>dz.classList.remove('drop');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drop');addFiles([...e.dataTransfer.files])};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));
load();
</script></body></html>
